# Pubblica il sito su GreenGeeks a ogni modifica del ramo main.
# Le credenziali FTP stanno nei Secrets del repository (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD).
name: Pubblica su GreenGeeks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carica i file via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .cpanel.yml
            README.md
            CLAUDE.md
